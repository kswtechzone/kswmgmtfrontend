name: Deploy Next.js Frontend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.kswtechzone.com.np/api/v1
          # Add any other build-time env variables here

      # Sync files to cPanel using SFTP
      # We sync the essential Next.js files (.next, public, package.json, package-lock.json, next.config.js, etc.)
      - name: Sync Files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 65.109.25.210
          username: kswms@kswtechzone.com.np
          password: ${{ secrets.FTP_PASSWORD}}
          port: 21 # Or 22 if utilizing SFTP
          # Local folder to deploy
          local-dir: ./
          # Remote server directory (e.g., /public_html or /nodejs_app)
          server-dir: ./
          # Files to exclude from uploading (e.g., source files that aren't needed in production runtime)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            tsconfig.json
            tailwind.config.js
            postcss.config.js
